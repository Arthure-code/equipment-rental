<p class="mb-3">
  <a routerLink="/equipment" class="link-secondary">&larr; All machines</a>
</p>

@if (message(); as note) {
  <output
    class="alert d-block py-2"
    [class.alert-secondary]="!note.error"
    [class.alert-danger]="note.error"
    data-testid="message"
  >
    {{ note.text }}
  </output>
}

@if (machine(); as found) {
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <app-equipment-card
        [equipment]="found"
        [busy]="busy()"
        (rent)="rent($event)"
        (cancelRental)="cancel()"
      />
    </div>
  </div>
} @else if (missing()) {
  <p class="alert alert-secondary" role="alert" data-testid="missing">
    There is no machine with that number.
  </p>
} @else {
  <output class="text-secondary">Loading...</output>
}
